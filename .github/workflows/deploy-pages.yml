name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: 사이트 만들기 (문제 폴더 묶기 포함)
        run: |
          rm -rf _site
          if [ -d public ]; then
            cp -r public _site
          else
            mkdir _site
            cp -r css js vendor *.html _site/
            mkdir -p public/js
            cp js/question-parser.js public/js/
          fi
          node tools/build-questions.mjs
          rm -rf _site/data
          cp -r public/data _site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
